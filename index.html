<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSpace Xcel | NASA Satellite Precision Agriculture</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for clean iconography -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Leaflet.js CSS & JS (Real-Time Satellite Mapping) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        space: {
                            950: '#040812',
                            900: '#081021',
                            800: '#0F1B35',
                            700: '#18294D',
                        },
                        agro: {
                            400: '#34D399',
                            500: '#10B981',
                            600: '#059669',
                        },
                        usm: {
                            purple: '#5B2C6F',
                            gold: '#F39C12',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'orbit': 'orbit 20s linear infinite',
                        'scan': 'scan 4s ease-in-out infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%, 100%': { transform: 'translateY(0%)', opacity: '0.2' },
                            '50%': { transform: 'translateY(100%)', opacity: '0.8' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Realistic NASA Orbital Earth Background */
        .nasa-orbital-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-color: #020617;
            background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=85&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }
        .nasa-orbital-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, rgba(4, 8, 18, 0.72) 0%, rgba(4, 8, 18, 0.84) 55%, rgba(4, 8, 18, 0.92) 100%);
            transition: background 0.3s ease;
        }
        .light .nasa-orbital-overlay {
            background: linear-gradient(180deg, rgba(241, 245, 249, 0.80) 0%, rgba(241, 245, 249, 0.88) 55%, rgba(248, 250, 252, 0.94) 100%);
        }

        /* Custom subtle grid background for space/satellite HUD feel */
        .bg-grid-pattern {
            background-size: 36px 36px;
            background-image: 
                linear-gradient(to right, rgba(56, 189, 248, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
        }
        .light .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(15, 23, 42, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.04) 1px, transparent 1px);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #081021;
        }
        ::-webkit-scrollbar-thumb {
            background: #18294D;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #10B981;
        }
        /* Smooth transitions for interactive bars */
        .bar-transition {
            transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s ease;
        }
        /* Leaflet Satellite Map Customization */

            height: 430px;
            width: 100%;
            z-index: 10;
            background: #040812;
        }

            font-family: 'JetBrains Mono', monospace !important;
        }
